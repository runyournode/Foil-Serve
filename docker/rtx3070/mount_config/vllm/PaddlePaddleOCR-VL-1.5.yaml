model: PaddlePaddle/PaddleOCR-VL-1.5
served-model-name:
  - PaddlePaddle/PaddleOCR-VL-1.5
  - PaddleOCR-VL-1.5-0.9B
trust-remote-code: True
trust-request-mm-kwargs: True
limit_mm_per_prompt: {image: 1}
# 8 GB shared with Ministral-3-3B (llama.cpp) and one pipeline worker
max_num_seqs: 8
max-num-batched-tokens: 8192  # smaller encoder batches: lower activation peak
max-model-len: 16384
no-enable-prefix-caching: True
mm-processor-cache-gb: 0
# Fixed KV cache (~21.7k tokens; 250 MB saturated on text-dense pages). vLLM >= 0.33
# profiles its batched vision encoder with a larger peak: a gpu-memory-utilization
# fraction would leave it a negative KV budget. Then only the free-VRAM startup check.
kv-cache-memory-bytes: 400000000
gpu-memory-utilization: 0.05
