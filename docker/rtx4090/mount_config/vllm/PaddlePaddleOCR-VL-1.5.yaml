model: PaddlePaddle/PaddleOCR-VL-1.5
served-model-name:
  - PaddlePaddle/PaddleOCR-VL-1.5
  - PaddleOCR-VL-1.5-0.9B
trust-remote-code: True
trust-request-mm-kwargs: True   # required (vLLM >= 0.31): PaddleX sends mm_processor_kwargs
enable-offline-docs: True       # /docs without a CDN
limit_mm_per_prompt: {image: 1}
no-enable-prefix-caching: True  # PaddleX recommendation: every crop is a new image
mm-processor-cache-gb: 0
# image ≤ 1280 + prompt + output ≤ 4096 (PaddleX cap); at 4096 vLLM silently cuts the output
max-model-len: 8192

# Sizing (guide at the end of pipeline_config.yaml)
max_num_seqs: 32
max-num-batched-tokens: 16384
# HTTP front-end processes (decode and resize the images: CPU), ~1.9 GB of RAM each.
# Under load, `top` in this container: the front-ends (`vllm serve` / VLLM::APIServer_*)
# near 100 % of a core → raise; all well below 50 % → overkill (3070: 1 at ~25 %).
# VLLM::EngineCore near 100 % instead: more front-ends do not help (add a vLLM replica).
api-server-count: 1
# Fixed KV cache, 18.4 KB per token (vLLM >= 0.33: never a gpu-memory-utilization fraction)
kv-cache-memory-bytes: 2000000000  # ~108k tokens
gpu-memory-utilization: 0.05    # with a fixed KV: only the free-VRAM check at startup
